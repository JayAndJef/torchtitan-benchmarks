[project]
name = "engine-bench"
version = "0.1.0"
description = "End-to-end and kernel benchmarks for the Piper Qwen3-1B TorchTitan port"
requires-python = ">=3.10"
dependencies = [
    "torch==2.14.1",
    # Pinned with torch, so that a new resolution cannot move triton.
    "triton==3.8.0 ; sys_platform == 'linux'",
    "torchtitan",
    "helion==1.4.0",
    "click>=8.1,<9",
    "scipy>=1.11",
    "ninja>=1.13.0",
]

[dependency-groups]
# Transformer Engine for the Megatron baseline arm
# (benchmarks/e2e/engines/megatron_stock/ and benchmarks/models/piper_qwen3/).
# core-cu13 is a prebuilt wheel; the torch binding compiles at install
# against the pinned torch, hence no-build-isolation below.
megatron = [
    "transformer-engine[pytorch,core-cu13]==2.17.1",
    "setuptools>=75",
    "wheel",
]
# FlashAttention-3 for the attention arms. FA3 is NOT on PyPI (the `flash-attn`
# package there is FA2) and publishes no prebuilt wheel, so it is a source
# build of CUTLASS sm90a kernels from the repo's hopper/ subdirectory --
# 15-40 minutes depending on MAX_JOBS. uv caches the built wheel by its source
# alone, as it does TE's torch binding, so sync.sh keeps one uv cache per
# torch pin.
# The four nvidia packages must share ONE CUDA version: mixing nvcc 13.0 with
# a 13.3 nvvm makes the frontend emit PTX ISA 9.3 that 13.0 ptxas rejects.
flash3 = [
    "flash-attn-3",
    "nvidia-cuda-nvcc==13.0.88",
    "nvidia-cuda-crt==13.0.88",
    "nvidia-nvvm==13.0.88",
    # Ships nv/target, which cuda_fp16.h includes and the cu13 wheel omits.
    "nvidia-cuda-cccl==13.0.85",
    "setuptools>=75",
    "wheel",
]
# FlashAttention-4 for the flex_flash arms. Unlike FA3 this is pure Python --
# the kernels are generated by the CuTe DSL at compile time -- so it needs no
# build pass and no gcc. torch reaches it by importing flash_attn.cute, both
# from FlexAttention's FLASH backend and from activate_flash_attention_impl.
# quack-kernels is pinned because only 0.5.x agrees with flash-attn-4's exact
# nvidia-cutlass-dsl==4.6.0.dev0; 0.6.x pins 4.6.0/4.6.1/4.6.2 and cannot resolve.
fa4 = [
    "flash-attn-4[cu13]==4.0.0b25",
    "quack-kernels==0.5.3",
]

[tool.uv]
package = false
default-groups = ["megatron", "flash3", "fa4"]
no-build-isolation-package = ["transformer-engine-torch", "flash-attn-3"]

[tool.uv.sources]
torchtitan = { path = "third_party/torchtitan", editable = true }
flash-attn-3 = { git = "https://github.com/Dao-AILab/flash-attention.git", subdirectory = "hopper", rev = "69e1bcbe77c359c84b3a4589e92a7c076e33a202" }
